<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>AutoShop Pro</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#182230;--muted:#667085;--line:#e5e9ef;--nav:#111827;--blue:#2563eb;--green:#15966b;--amber:#b7791f;--red:#c2413b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:38px;height:38px;border-radius:11px;background:#2563eb;display:grid;place-items:center;font-size:21px}.brand b{font-size:18px}.brand small{display:block;color:#9ca3af;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 13px;border-radius:9px;display:flex;gap:12px;align-items:center}nav button.active,nav button:hover{background:#263449;color:#fff}nav .ico{width:20px;text-align:center}.aside-foot{margin-top:auto;color:#9ca3af;font-size:12px;padding:8px}
main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.topbar h2{font-size:18px;margin:0}.topright{display:flex;align-items:center;gap:12px}.avatar{background:#e8efff;color:#2455b8;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:700}
.content{padding:28px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.small{padding:7px 10px;font-size:13px}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.stat-label{font-size:13px;color:var(--muted)}.stat{font-size:28px;font-weight:750;margin:8px 0 3px}.stat-note{font-size:12px;color:var(--muted)}.layout2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel h3{font-size:16px;margin:0 0 15px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel-head h3{margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600;background:#fafbfc}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f7;color:#475467}.pill.open{background:#e8f0ff;color:#2455b8}.pill.progress{background:#fff4dd;color:#946200}.pill.done{background:#e4f7ef;color:#08744d}.empty{text-align:center;color:var(--muted);padding:30px 10px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:15px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:650}.quick button span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.searchrow{display:flex;gap:10px;margin-bottom:14px}.searchrow input{max-width:360px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:650;color:#344054}.field input,.field select,.field textarea,.searchrow input{width:100%;padding:10px 11px;border:1px solid #d7dde5;border-radius:8px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.searchrow input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.modalback{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px;font-size:20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:12px 14px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:16px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:var(--muted)}.mobile-menu{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{padding:12px 14px;gap:10px;position:sticky;top:0;z-index:4}.brand{padding:0 4px}.brand small,.aside-foot{display:none}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;padding:9px 11px;font-size:13px}nav .ico{display:none}.topbar{height:58px;padding:0 17px}.content{padding:19px 15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}
@media(max-width:520px){.cards{gap:9px}.card{padding:13px}.stat{font-size:23px}.pagehead{align-items:center}.pagehead h1{font-size:21px}.pagehead .btn{padding:9px;font-size:12px}.formgrid{grid-template-columns:1fr}.topright .shoplabel{display:none}}
</style>
</head>
<body>
<div id="authGate" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:#f3f5f8"><div class="panel" style="width:min(440px,100%);padding:28px"><div class="brand" style="padding:0 0 20px;color:#182230"><div class="logo">🔧</div><div><b>AutoShop Pro</b><small style="color:#667085">Secure shop access</small></div></div><div id="authContent"></div></div></div>
<div class="shell" id="appShell">
<aside>
 <div class="brand"><div class="logo">🔧</div><div><b>AutoShop Pro</b><small>Shop management</small></div></div>
 <nav id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button data-page="workorders"><span class="ico">🛠</span>Repair Orders</button>
  <button data-page="customers"><span class="ico">♙</span>Customers</button>
  <button data-page="vehicles"><span class="ico">🚗</span>Vehicles</button>
  <button data-page="parts"><span class="ico">▤</span>Parts & Inventory</button>
  <button data-page="reports"><span class="ico">▥</span>Reports</button>
  <button data-page="settings"><span class="ico">⚙</span>Shop Settings</button>
 </nav>
 <div class="aside-foot">Independent shop edition<br>Cloud-connected shop workspace</div>
</aside>
<main>
 <header class="topbar"><h2 id="topTitle">Dashboard</h2><div class="topright"><span class="shoplabel muted" id="shopNameTop">Connecting…</span><span id="syncStatus" class="muted" style="font-size:12px">Connecting</span><button class="btn small" onclick="signOut()">Sign out</button></div></header>
 <section class="content" id="view"></section>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div id="modalbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://hlprafqxfnlwgvchvukv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_wC34Ftzul4vW5cAYGXrJjQ_xqwDuS3N";
const sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,shopId=null,syncTimer=null,syncing=false,cloudReady=false;
const KEY='autoshoppro_v1';
const blank={shop:{name:'Your Automotive Shop',phone:'',email:'',address:'',laborRate:125,taxRate:8.25},customers:[],vehicles:[],orders:[],parts:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(blank)}catch(e){db=structuredClone(blank)}
let page='dashboard';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toFixed(2);
function id(){return crypto.randomUUID()}
function save(){localStorage.setItem(KEY,JSON.stringify(db));if($('#shopNameTop'))$('#shopNameTop').textContent=db.shop.name||'Your Automotive Shop';if(cloudReady&&!syncing){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncAll().catch(showSyncError),700)}}
function customerName(cid){let c=db.customers.find(x=>x.id===cid);return c?c.name:'Unknown customer'}
function vehicleName(vid){let v=db.vehicles.find(x=>x.id===vid);return v?[v.year,v.make,v.model].filter(Boolean).join(' '):'Vehicle not linked'}
function statusPill(s){let cl=s==='In Progress'?'progress':s==='Completed'?'done':'open';return `<span class="pill ${cl}">${esc(s||'Open')}</span>`}
function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,value,note){return `<div class="card"><div class="stat-label">${label}</div><div class="stat">${value}</div><div class="stat-note">${note}</div></div>`}
function render(){
 save();$('#topTitle').textContent=({dashboard:'Dashboard',workorders:'Repair Orders',customers:'Customers',vehicles:'Vehicles',parts:'Parts & Inventory',reports:'Reports',settings:'Shop Settings'})[page];
 const v=$('#view');
 if(page==='dashboard'){
  let open=db.orders.filter(o=>o.status!=='Completed'),progress=db.orders.filter(o=>o.status==='In Progress'),sales=db.orders.reduce((a,o)=>a+Number(o.total||0),0);
  v.innerHTML=pageHead('Good morning','Here is what is happening in your shop today.',`<button class="btn primary" onclick="openOrder()">＋ New Repair Order</button>`)+
  `<div class="cards">${stat('Open repair orders',open.length,'Vehicles needing attention')}${stat('In progress',progress.length,'Currently being worked on')}${stat('Customers',db.customers.length,'In your customer list')}${stat('Parts in catalog',db.parts.length,'Tracked inventory items')}</div>
  <div class="layout2"><div class="panel"><div class="panel-head"><h3>Recent repair orders</h3><button class="btn small" onclick="setPage('workorders')">View all</button></div>${ordersTable(db.orders.slice().reverse().slice(0,6))}</div>
  <div class="panel"><h3>Quick actions</h3><div class="quick"><button onclick="openCustomer()">＋ Add customer<span>Create a customer record</span></button><button onclick="openVehicle()">＋ Add vehicle<span>Register a customer vehicle</span></button><button onclick="openOrder()">＋ Create repair order<span>Start a new job</span></button><button onclick="openPart()">＋ Add part<span>Track shop inventory</span></button></div><div class="notice" style="margin-top:15px">Your information is currently stored in this browser on this device. Cloud sync and employee logins are planned for the next setup phase.</div></div></div>`;
 }else if(page==='workorders'){
  v.innerHTML=pageHead('Repair Orders','Track customer vehicles, job status, labor and totals.',`<button class="btn primary" onclick="openOrder()">＋ New Repair Order</button>`)+`<div class="panel"><div class="searchrow"><input id="orderSearch" placeholder="Search RO, customer or vehicle..." oninput="filterTable('orderTable',this.value)"><select id="statusFilter" onchange="filterStatus(this.value)" style="max-width:170px;padding:10px;border:1px solid var(--line);border-radius:8px"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Completed</option></select></div><div id="orderTable">${ordersTable(db.orders.slice().reverse())}</div></div>`;
 }else if(page==='customers'){
  v.innerHTML=pageHead('Customers','Customer contact information and linked vehicles.',`<button class="btn primary" onclick="openCustomer()">＋ Add Customer</button>`)+`<div class="panel"><div class="searchrow"><input placeholder="Search customers..." oninput="filterTable('customerTable',this.value)"></div><div id="customerTable">${customerTable()}</div></div>`;
 }else if(page==='vehicles'){
  v.innerHTML=pageHead('Vehicles','Vehicle records linked to your customers.',`<button class="btn primary" onclick="openVehicle()">＋ Add Vehicle</button>`)+`<div class="panel"><div class="searchrow"><input placeholder="Search year, make, model or VIN..." oninput="filterTable('vehicleTable',this.value)"></div><div id="vehicleTable">${vehicleTable()}</div></div>`;
 }else if(page==='parts'){
  v.innerHTML=pageHead('Parts & Inventory','Maintain a basic catalog of shop parts and quantities.',`<button class="btn primary" onclick="openPart()">＋ Add Part</button>`)+`<div class="panel"><div class="searchrow"><input placeholder="Search part name or number..." oninput="filterTable('partsTable',this.value)"></div><div id="partsTable">${partsTable()}</div></div>`;
 }else if(page==='reports'){
  let completed=db.orders.filter(o=>o.status==='Completed'),revenue=completed.reduce((a,o)=>a+Number(o.total||0),0),openVal=db.orders.filter(o=>o.status!=='Completed').reduce((a,o)=>a+Number(o.total||0),0);
  v.innerHTML=pageHead('Shop Reports','A simple snapshot of the records entered in AutoShop Pro.')+`<div class="cards">${stat('Completed order value',money(revenue),'Total value of completed ROs')}${stat('Open order value',money(openVal),'Not yet completed')}${stat('Average completed RO',money(completed.length?revenue/completed.length:0),'Based on completed orders')}${stat('Low-stock parts',db.parts.filter(p=>Number(p.qty)<=Number(p.reorder||0)).length,'At or below reorder point')}</div><div class="panel"><h3>Important note</h3><p class="muted">These are basic operational totals, not accounting-grade financial statements. Taxes, refunds, discounts, labor cost, and parts cost need fuller accounting workflows before relying on reports for bookkeeping or tax filing.</p><button class="btn" onclick="exportData()">Export shop data (JSON)</button></div>`;
 }else if(page==='settings'){
  v.innerHTML=pageHead('Shop Settings','Set your shop details and default pricing.')+`<div class="settings-grid"><div class="panel"><h3>Shop information</h3><form onsubmit="saveSettings(event)"><div class="field"><label>Shop name</label><input name="name" value="${esc(db.shop.name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(db.shop.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(db.shop.email)}"></div><div class="field"><label>Address</label><textarea name="address">${esc(db.shop.address)}</textarea></div><button class="btn primary">Save shop details</button></form></div><div class="panel"><h3>Default pricing</h3><form onsubmit="saveRates(event)"><div class="field"><label>Labor rate ($ per hour)</label><input name="laborRate" type="number" min="0" step=".01" value="${db.shop.laborRate}"></div><div class="field"><label>Default sales tax (%)</label><input name="taxRate" type="number" min="0" step=".01" value="${db.shop.taxRate}"></div><button class="btn primary">Save pricing</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Data backup</h3><p class="muted">Export a copy of your shop data regularly. Import/restore and secure cloud backups will be added in a later phase.</p><button class="btn" onclick="exportData()">Export backup</button></div></div>`;
 }
}
function ordersTable(list){if(!list.length)return `<div class="empty">No repair orders yet. Create your first repair order to get started.</div>`;return `<div class="table-wrap"><table><thead><tr><th>RO #</th><th>Customer</th><th>Vehicle</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>${list.map(o=>`<tr data-search="${esc((o.number+' '+customerName(o.customerId)+' '+vehicleName(o.vehicleId)).toLowerCase())}" data-status="${esc(o.status)}"><td><b>${esc(o.number)}</b></td><td>${esc(customerName(o.customerId))}</td><td>${esc(vehicleName(o.vehicleId))}</td><td>${statusPill(o.status)}</td><td>${money(o.total)}</td><td><button class="btn small" onclick="editOrder('${o.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function customerTable(){if(!db.customers.length)return `<div class="empty">No customers added yet.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Vehicles</th><th></th></tr></thead><tbody>${db.customers.map(c=>`<tr data-search="${esc((c.name+' '+c.phone+' '+c.email).toLowerCase())}"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${db.vehicles.filter(v=>v.customerId===c.id).length}</td><td><button class="btn small" onclick="editCustomer('${c.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function vehicleTable(){if(!db.vehicles.length)return `<div class="empty">No vehicles added yet.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Customer</th><th>VIN</th><th>Mileage</th><th></th></tr></thead><tbody>${db.vehicles.map(v=>`<tr data-search="${esc((v.year+' '+v.make+' '+v.model+' '+v.vin).toLowerCase())}"><td><b>${esc([v.year,v.make,v.model].join(' '))}</b><br><span class="muted">${esc(v.engine)}</span></td><td>${esc(customerName(v.customerId))}</td><td>${esc(v.vin)}</td><td>${esc(v.mileage)}</td><td><button class="btn small" onclick="editVehicle('${v.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function partsTable(){if(!db.parts.length)return `<div class="empty">No parts in your catalog yet.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Part</th><th>Part number</th><th>Qty</th><th>Cost</th><th>Sell price</th><th></th></tr></thead><tbody>${db.parts.map(p=>`<tr data-search="${esc((p.name+' '+p.number).toLowerCase())}"><td><b>${esc(p.name)}</b></td><td>${esc(p.number)}</td><td>${p.qty<=p.reorder?'<span style="color:#b7791f;font-weight:700">':''}${esc(p.qty)}${p.qty<=p.reorder?'</span>':''}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><button class="btn small" onclick="editPart('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function modal(title,html){$('#modalbody').innerHTML=`<h2>${title}</h2>${html}`;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
function field(label,name,val='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`}
function customerOptions(selected=''){return db.customers.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function vehicleOptions(selected=''){return db.vehicles.map(v=>`<option value="${v.id}" ${v.id===selected?'selected':''}>${esc(vehicleName(v.id))} — ${esc(customerName(v.customerId))}</option>`).join('')}
function openCustomer(c={}){modal(c.id?'Edit Customer':'Add Customer',`<form onsubmit="saveCustomer(event,'${c.id||''}')"><div class="formgrid">${field('Customer name','name',c.name||'','text','required')}${field('Phone','phone',c.phone||'','tel')}${field('Email','email',c.email||'','email')}${field('Address','address',c.address||'')}</div><div class="field"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Customer</button></div></form>`)}
function saveCustomer(e,edit){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);if(edit)Object.assign(db.customers.find(x=>x.id===edit),o);else db.customers.push({id:id(),...o});closeModal();render()}
function editCustomer(x){openCustomer(db.customers.find(c=>c.id===x))}
function openVehicle(v={}){if(!db.customers.length){alert('Add a customer first, then add their vehicle.');return}modal(v.id?'Edit Vehicle':'Add Vehicle',`<form onsubmit="saveVehicle(event,'${v.id||''}')"><div class="field"><label>Customer</label><select name="customerId" required>${customerOptions(v.customerId)}</select></div><div class="formgrid">${field('Year','year',v.year||'','number')}${field('Make','make',v.make||'')}${field('Model','model',v.model||'')}${field('Engine','engine',v.engine||'')}${field('VIN','vin',v.vin||'')}${field('License plate','plate',v.plate||'')}${field('Current mileage','mileage',v.mileage||'','number')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Vehicle</button></div></form>`)}
function saveVehicle(e,edit){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(edit)Object.assign(db.vehicles.find(x=>x.id===edit),o);else db.vehicles.push({id:id(),...o});closeModal();render()}
function editVehicle(x){openVehicle(db.vehicles.find(v=>v.id===x))}
function openPart(p={}){modal(p.id?'Edit Part':'Add Part',`<form onsubmit="savePart(event,'${p.id||''}')"><div class="formgrid">${field('Part name','name',p.name||'','text','required')}${field('Part number','number',p.number||'')}${field('Quantity on hand','qty',p.qty??0,'number','min="0"')}${field('Reorder point','reorder',p.reorder??1,'number','min="0"')}${field('Unit cost ($)','cost',p.cost??0,'number','min="0" step=".01"')}${field('Selling price ($)','price',p.price??0,'number','min="0" step=".01"')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Part</button></div></form>`)}
function savePart(e,edit){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));['qty','reorder','cost','price'].forEach(k=>o[k]=Number(o[k]||0));if(edit)Object.assign(db.parts.find(x=>x.id===edit),o);else db.parts.push({id:id(),...o});closeModal();render()}
function editPart(x){openPart(db.parts.find(p=>p.id===x))}
function openOrder(o={}){if(!db.customers.length||!db.vehicles.length){alert('Add a customer and vehicle before creating a repair order.');return}let num=o.number||('RO-'+String(Date.now()).slice(-6));modal(o.id?'Edit Repair Order':'New Repair Order',`<form onsubmit="saveOrder(event,'${o.id||''}')"><div class="formgrid"><div class="field"><label>RO number</label><input name="number" value="${esc(num)}" required></div><div class="field"><label>Status</label><select name="status">${['Open','In Progress','Completed'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Customer</label><select name="customerId" id="roCustomer" onchange="updateVehicleSelect()" required>${customerOptions(o.customerId)}</select></div><div class="field"><label>Vehicle</label><select name="vehicleId" id="roVehicle" required>${vehicleOptions(o.vehicleId)}</select></div></div><div class="field"><label>Customer concern / requested work</label><textarea name="concern" required>${esc(o.concern||'')}</textarea></div><div class="formgrid">${field('Labor hours','hours',o.hours??0,'number','min="0" step=".1"')}${field('Parts total ($)','partsTotal',o.partsTotal??0,'number','min="0" step=".01"')}</div><div class="formgrid">${field('Additional fees ($)','fees',o.fees??0,'number','min="0" step=".01"')}${field('Discount ($)','discount',o.discount??0,'number','min="0" step=".01"')}</div><div class="field"><label>Technician / assigned to</label><input name="technician" value="${esc(o.technician||'')}" placeholder="Technician name"></div><div class="field"><label>Internal notes</label><textarea name="notes">${esc(o.notes||'')}</textarea></div><div class="notice">Labor rate: ${money(db.shop.laborRate)}/hr · Tax: ${Number(db.shop.taxRate).toFixed(2)}%. Total is calculated when saved.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Repair Order</button></div></form>`)}
function updateVehicleSelect(){let cid=$('#roCustomer').value;$('#roVehicle').innerHTML=db.vehicles.filter(v=>v.customerId===cid).map(v=>`<option value="${v.id}">${esc(vehicleName(v.id))}</option>`).join('');}
function saveOrder(e,edit){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let subtotal=Number(o.hours)*Number(db.shop.laborRate)+Number(o.partsTotal)+Number(o.fees)-Number(o.discount);o.subtotal=subtotal;o.tax=subtotal*Number(db.shop.taxRate)/100;o.total=subtotal+o.tax;o.hours=Number(o.hours);o.partsTotal=Number(o.partsTotal);o.fees=Number(o.fees);o.discount=Number(o.discount);o.updated=new Date().toISOString();if(edit)Object.assign(db.orders.find(x=>x.id===edit),o);else db.orders.push({id:id(),created:new Date().toISOString(),...o});closeModal();render()}
function editOrder(x){let o=db.orders.find(o=>o.id===x);modal('Repair Order '+o.number,`<div class="notice">${statusPill(o.status)} · ${esc(customerName(o.customerId))} · ${esc(vehicleName(o.vehicleId))}<br><b>Current total: ${money(o.total)}</b></div><p><b>Customer concern</b><br>${esc(o.concern)}</p><p><b>Technician:</b> ${esc(o.technician||'Unassigned')}</p><p><b>Labor:</b> ${o.hours} hr · <b>Parts:</b> ${money(o.partsTotal)} · <b>Tax:</b> ${money(o.tax)}</p><p class="muted">${esc(o.notes||'No internal notes')}</p><div class="modal-actions"><button class="btn danger" onclick="deleteOrder('${o.id}')">Delete</button><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="openOrder(db.orders.find(x=>x.id==='${o.id}'))">Edit Order</button></div>`)}
async function deleteOrder(x){if(!confirm('Delete this repair order?'))return;db.orders=db.orders.filter(o=>o.id!==x);closeModal();render();if(cloudReady){const {error}=await sbClient.from('repair_orders').delete().eq('id',x).eq('shop_id',shopId);if(error)showSyncError(error)}}
function saveSettings(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));Object.assign(db.shop,o);save();alert('Shop details saved.')}
function saveRates(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.shop.laborRate=Number(o.laborRate);db.shop.taxRate=Number(o.taxRate);save();alert('Pricing saved.');render()}
function filterTable(id,q){let x=$('#'+id);if(!x)return;q=q.toLowerCase();x.querySelectorAll('tbody tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}
function filterStatus(s){$('#orderTable').querySelectorAll('tbody tr').forEach(r=>r.style.display=(!s||r.dataset.status===s)?'':'none')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='autoshop-pro-backup.json';a.click();URL.revokeObjectURL(a.href)}

function showAuth(html){$('#appShell').style.display='none';$('#authGate').style.display='flex';$('#authContent').innerHTML=html}
function authScreen(message=''){showAuth(`<h2 style="margin:0 0 8px">Sign in to your shop</h2><p class="muted" style="margin:0 0 18px">Your customers, vehicles, parts and repair orders will sync securely across your computer and Android app.</p>${message?`<div class="notice">${esc(message)}</div>`:''}<form onsubmit="authenticate(event)"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="6" autocomplete="current-password"></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" type="submit" name="mode" value="signin">Sign in</button><button class="btn" type="submit" name="mode" value="signup">Create account</button></div></form><p class="muted" style="font-size:12px;margin-top:18px">Use the same account on every device to access the same shop data.</p>`)}
async function authenticate(e){e.preventDefault();const f=new FormData(e.target),email=f.get('email'),password=f.get('password'),mode=e.submitter?.value||'signin';$('#authContent').querySelectorAll('button').forEach(b=>b.disabled=true);let result=mode==='signup'?await sbClient.auth.signUp({email,password}):await sbClient.auth.signInWithPassword({email,password});if(result.error){authScreen(result.error.message);return}if(mode==='signup'&&!result.data.session){authScreen('Account created. Check your email for the confirmation link, then return here and sign in.');return}await initializeApp()}
async function signOut(){cloudReady=false;await sbClient.auth.signOut();currentUser=null;shopId=null;authScreen()}
function shopSetup(message=''){showAuth(`<h2 style="margin:0 0 8px">Set up your shop</h2><p class="muted">Create the shop workspace that will hold your business records.</p>${message?`<div class="notice">${esc(message)}</div>`:''}<form onsubmit="createShop(event)"><div class="field"><label>Shop name</label><input name="shopName" required maxlength="120" placeholder="Example: Main Street Auto Repair"></div><button class="btn primary">Create my shop</button></form>`)}
async function createShop(e){e.preventDefault();const name=new FormData(e.target).get('shopName');const {data,error}=await sbClient.rpc('create_shop',{p_name:name});if(error){shopSetup(error.message);return}shopId=data;await loadCloudData()}
async function initializeApp(){try{const {data:{session},error}=await sbClient.auth.getSession();if(error)throw error;if(!session){cloudReady=false;authScreen();return}currentUser=session.user;$('#authGate').style.display='none';$('#appShell').style.display='grid';$('#syncStatus').textContent='Loading cloud data…';const {data:members,error:memberError}=await sbClient.from('shop_members').select('shop_id,role').eq('user_id',currentUser.id);if(memberError)throw memberError;if(!members?.length){shopSetup();return}shopId=members[0].shop_id;await loadCloudData()}catch(err){showAuth(`<h2>Connection problem</h2><div class="notice">${esc(err.message||String(err))}</div><button class="btn primary" onclick="initializeApp()">Try again</button>`)}}
async function loadCloudData(){const {data:shop,error:shopErr}=await sbClient.from('shops').select('*').eq('id',shopId).single();if(shopErr)throw shopErr;const tables=['customers','vehicles','parts','repair_orders'];const results=await Promise.all(tables.map(t=>sbClient.from(t).select('*').eq('shop_id',shopId)));for(let i=0;i<results.length;i++)if(results[i].error)throw results[i].error;const [cs,vs,ps,os]=results.map(r=>r.data||[]);db.shop={name:shop.name,phone:shop.phone||'',email:shop.email||'',address:shop.address||'',laborRate:Number(shop.labor_rate),taxRate:Number(shop.tax_rate)};db.customers=cs.map(x=>({...x}));db.vehicles=vs.map(x=>({id:x.id,customerId:x.customer_id,year:x.year,make:x.make,model:x.model,engine:x.engine,vin:x.vin,plate:x.plate,mileage:x.mileage}));db.parts=ps.map(x=>({id:x.id,name:x.name,number:x.part_number,qty:x.quantity,reorder:x.reorder_point,cost:Number(x.unit_cost),price:Number(x.selling_price),vendor:x.vendor||''}));db.orders=os.map(x=>({id:x.id,number:x.ro_number,customerId:x.customer_id,vehicleId:x.vehicle_id,status:x.status,concern:x.concern,technician:x.technician,hours:Number(x.labor_hours),partsTotal:Number(x.parts_total),fees:Number(x.fees),discount:Number(x.discount),subtotal:Number(x.subtotal),tax:Number(x.tax),total:Number(x.total),notes:x.notes||''}));localStorage.setItem(KEY,JSON.stringify(db));cloudReady=true;$('#syncStatus').textContent='Synced';$('#shopNameTop').textContent=db.shop.name;render()}
async function syncAll(){if(!cloudReady||!shopId||syncing)return;syncing=true;$('#syncStatus').textContent='Syncing…';try{const sid=shopId;const shopUpdate=await sbClient.from('shops').update({name:db.shop.name,phone:db.shop.phone||null,email:db.shop.email||null,address:db.shop.address||null,labor_rate:Number(db.shop.laborRate)||0,tax_rate:Number(db.shop.taxRate)||0}).eq('id',sid);if(shopUpdate.error)throw shopUpdate.error;
const customers=db.customers.map(c=>({id:c.id,shop_id:sid,name:c.name,phone:c.phone||null,email:c.email||null,address:c.address||null,notes:c.notes||null}));if(customers.length){const r=await sbClient.from('customers').upsert(customers);if(r.error)throw r.error}
const vehicles=db.vehicles.map(v=>({id:v.id,shop_id:sid,customer_id:v.customerId,year:v.year?Number(v.year):null,make:v.make||null,model:v.model||null,engine:v.engine||null,vin:v.vin||null,plate:v.plate||null,mileage:v.mileage?Number(v.mileage):null}));if(vehicles.length){const r=await sbClient.from('vehicles').upsert(vehicles);if(r.error)throw r.error}
const parts=db.parts.map(p=>({id:p.id,shop_id:sid,name:p.name,part_number:p.number||null,quantity:Number(p.qty)||0,reorder_point:Number(p.reorder)||0,unit_cost:Number(p.cost)||0,selling_price:Number(p.price)||0,vendor:p.vendor||null}));if(parts.length){const r=await sbClient.from('parts').upsert(parts);if(r.error)throw r.error}
const orders=db.orders.map(o=>({id:o.id,shop_id:sid,ro_number:o.number,customer_id:o.customerId,vehicle_id:o.vehicleId,status:o.status||'Open',concern:o.concern,technician:o.technician||null,labor_hours:Number(o.hours)||0,labor_rate:Number(db.shop.laborRate)||125,parts_total:Number(o.partsTotal)||0,fees:Number(o.fees)||0,discount:Number(o.discount)||0,subtotal:Number(o.subtotal)||0,tax_rate:Number(db.shop.taxRate)||0,tax:Number(o.tax)||0,total:Number(o.total)||0,notes:o.notes||null}));if(orders.length){const r=await sbClient.from('repair_orders').upsert(orders);if(r.error)throw r.error}
$('#syncStatus').textContent='Synced';localStorage.setItem(KEY,JSON.stringify(db));}finally{syncing=false}}
function showSyncError(err){$('#syncStatus').textContent='Sync error';console.error('AutoShop Pro sync error:',err);alert('Your change is saved on this device, but cloud sync failed: '+(err.message||err)+'. Check your connection and sign in again.');}

initializeApp();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
